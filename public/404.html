<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página no encontrada · Portafolio web</title>
<meta name="description" content="Desarrollo herramientas web a medida que ordenan procesos, automatizan tareas repetitivas y ponen la información a mano.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0E0F0C}
html{scroll-behavior:smooth}
a{color:#C8F25A}a:hover{color:#E4FF9E}
.pf *{box-sizing:border-box}
.pf ::selection{background:#C8F25A;color:#0E0F0C}
.wrap{max-width:1240px;margin:0 auto;padding-left:clamp(16px,4vw,48px);padding-right:clamp(16px,4vw,48px)}
.navlinks{display:flex;gap:28px;align-items:center}
.navlinks a{color:#B9B8B0;text-decoration:none;font-weight:600;font-size:15px;transition:color .2s}
.navlinks a:hover{color:#F2F1EC}
.navlinks a.btn-main{color:#0E0F0C}
.h1{font-family:'Bricolage Grotesque',serif;font-weight:800;font-size:clamp(44px,8.4vw,128px);line-height:.92;letter-spacing:-.035em;margin:0}
.h2{font-family:'Bricolage Grotesque',serif;font-weight:700;font-size:clamp(34px,5vw,72px);line-height:1;letter-spacing:-.03em;margin:0}
.word{display:inline-block;animation:rise .9s cubic-bezier(.2,.8,.2,1) both}
.w2{animation-delay:.12s}.w3{animation-delay:.24s}.w4{animation-delay:.36s}
.fadein{animation:fade 1s .5s ease both}
@keyframes rise{from{opacity:0;transform:translateY(60%) rotate(3deg)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.35;animation:float 14s ease-in-out infinite alternate;pointer-events:none}
@keyframes float{0%{transform:translate(0,0) scale(1)}100%{transform:translate(60px,-40px) scale(1.15)}}
.pulse{width:10px;height:10px;border-radius:50%;background:#C8F25A;box-shadow:0 0 0 0 rgba(200,242,90,.6);animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 12px rgba(200,242,90,0)}100%{box-shadow:0 0 0 0 rgba(200,242,90,0)}}
.marq{display:flex;width:max-content;animation:marq 28s linear infinite}
.marq:hover{animation-play-state:paused}
@keyframes marq{to{transform:translateX(-50%)}}
.btn{display:inline-flex;align-items:center;gap:10px;min-height:52px;padding:0 26px;border-radius:999px;font-weight:700;font-size:16px;text-decoration:none;transition:transform .25s cubic-bezier(.2,.8,.2,1),background .2s,color .2s}
.btn:hover{transform:translateY(-3px)}
.btn-main{background:#C8F25A;color:#0E0F0C}
.btn-main:hover{background:#E4FF9E;color:#0E0F0C}
.btn-ghost{border:1.5px solid #3A3B35;color:#F2F1EC}
.btn-ghost:hover{border-color:#F2F1EC;color:#F2F1EC}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.card{position:relative;border:1px solid #2A2B26;border-radius:24px;background:#161713;padding:32px;transition:transform .35s cubic-bezier(.2,.8,.2,1),border-color .3s}
.card:hover{transform:translateY(-6px);border-color:#C8F25A}
.proj{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:40px;align-items:center;text-decoration:none;color:inherit}
.shot{position:relative;aspect-ratio:16/10;border-radius:20px;overflow:hidden;border:1px solid #2A2B26;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.proj:hover .shot{transform:scale(1.02) rotate(-.6deg)}
.arrow{transition:transform .3s}
.proj:hover .arrow{transform:translate(6px,-6px)}
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}
.contact{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:40px;align-items:end}
@supports (animation-timeline: view()){
.rv{animation:rv linear both;animation-timeline:view();animation-range:entry 0% cover 28%}
@keyframes rv{from{opacity:0;transform:translateY(50px)}to{opacity:1;transform:none}}
}
@media (max-width:900px){
.navlinks .hidem{display:none}
.grid3,.steps{grid-template-columns:minmax(0,1fr)}
.proj,.contact{grid-template-columns:minmax(0,1fr);gap:24px}
.proj .shot{order:-1}
}
@media (min-width:901px) and (max-width:1100px){.steps{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (prefers-reduced-motion:reduce){.pf *,.pf *::before{animation:none !important;transition:none !important}}
</style>
</head>
<body>
<main class="pf" style="background: #0E0F0C; color: #F2F1EC; font-family: Manrope, sans-serif; font-size: 17px; line-height: 1.55; min-height: 100vh; display: flex; align-items: center">
<div class="wrap" style="width: 100%">
<p style="color: #C8F25A; font-weight: 700; margin: 0 0 16px">Error 404</p>
<h1 class="h1">Esta página<br>no existe.</h1>
<p style="max-width: 520px; color: #B9B8B0; margin: 28px 0 36px">Puede que el link esté mal escrito o que la página se haya movido.</p>
<a class="btn btn-main" href="/">Volver al inicio</a>
</div>
</main>
</body>
</html>
